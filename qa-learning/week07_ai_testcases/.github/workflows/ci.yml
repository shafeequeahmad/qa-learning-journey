name: CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest --junit-xml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: report.xml
          path: report.xml