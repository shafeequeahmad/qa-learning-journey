[pytest]
python_files = check_*.py test_*.py
python_classes = Check* Test*
python_functions = check_* test_*
markers =
    cls: marker for TCs using class session scope
    session: marker for TCs using session scope
    codegen: marker for TCs using codegen
    locator: marker for TCs using locator
    builtinlocators: marker for TCs using builtin locators
    browser: marker for TCs using browser
    jsalert: marker for TCs using jsalert
    iframe: marker for TCs using iframe
    tracing: marker for TCs using tracing
    dropdown: marker for TCs using dropdown
    tables: marker for TCs using table
    stables: marker for TCs using sortable table
    form: marker for TCs using form
    parameter: tests that use parameterization for login
    storage: tests related to storage functionality
    orangehrm: mark test as part of orangehrm test suite
    mockdata: marker for mockdata TCs
    mock_request: marker for mocking API request testcases
    mock_response: marker for mocking API response
    login: marker for orageHRM website related test
    api: mark a test as an API test
    api_get: mark a test as an API GET test
    api_post: mark a test as an API POST test
    api_patch: mark a test as an API PATCH test
    api_put: mark a test as an API PUT test
    api_delete: mark a test as an API DELETE test
    smoke: quick sanity checks before deployment
    regression: full test suite
    raid: RAID-specific tests
    ui: WebUI tests
    agent: AI agent tests

addopts = --html=output_files/latest.html --self-contained-html --browser=firefox